  <text x="162" y="184" fill="#f4f4f6" fill-opacity=".58" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="13">Live platform — analytics, contact, admin, reports.</text>
  <rect x="542" y="180" width="56" height="20" rx="10" fill="none" stroke="#4da3ff" stroke-opacity=".45"/>
