  <g transform="translate(662,130)" fill="none" stroke="#4da3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10h18v2a7 7 0 0 1-7 7h-4a7 7 0 0 1-7-7v-2z"/><path d="M8 6c1-2 2.5-3 4-3s3 1 4 3"/><path d="M7 19h10"/>
  </g>
  <text x="700" y="148" fill="#f4f4f6" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600">Hooshmand</text>
  <text x="662" y="184" fill="#f4f4f6" fill-opacity=".58" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="13">Culinary AI chatbot — RAG, pantry match, streaming.</text>
  <rect x="1042" y="180" width="56" height="20" rx="10" fill="none" stroke="#4da3ff" stroke-opacity=".45"/>
  <text x="1070" y="194" text-anchor="middle" fill="#4da3ff" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.08em">live</text>


  <rect x="140" y="232" width="480" height="110" rx="16" fill="url(#glassTile)" stroke="url(#rim)" stroke-width="1"/>
  <g transform="translate(162,256)" fill="none" stroke="#4da3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="2,16 7,10 11,14 16,6 22,12"/><circle cx="16" cy="6" r="1.5" fill="#4da3ff" stroke="none"/>
  </g>
  <text x="200" y="274" fill="#f4f4f6" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600">Decision Intelligence</text>
  <text x="162" y="310" fill="#f4f4f6" fill-opacity=".58" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="13">ERP / CRM / sheets → one operator decision layer.</text>
  <rect x="542" y="306" width="56" height="20" rx="10" fill="none" stroke="#4da3ff" stroke-opacity=".45"/>
  <text x="570" y="320" text-anchor="middle" fill="#4da3ff" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.08em">build</text>


  <rect x="640" y="232" width="480" height="110" rx="16" fill="url(#glassTile)" stroke="url(#rim)" stroke-width="1"/>
  <g transform="translate(662,256)" fill="none" stroke="#4da3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="10" height="10" rx="2"/><rect x="11" y="11" width="10" height="10" rx="2"/>
  </g>
  <text x="700" y="274" fill="#f4f4f6" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600">Agent Automation</text>
  <text x="662" y="310" fill="#f4f4f6" fill-opacity=".58" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="13">Typed agents decide. n8n owns the writes.</text>
  <rect x="1042" y="306" width="56" height="20" rx="10" fill="none" stroke="#4da3ff" stroke-opacity=".45"/>
  <text x="1070" y="320" text-anchor="middle" fill="#4da3ff" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.08em">build</text>

</svg>
