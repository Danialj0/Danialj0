      <stop offset=".35" stop-color="#4da3ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4da3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx=".82" cy=".85" r=".55">
      <stop offset="0" stop-color="#7ec1ff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#7ec1ff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#7ec1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx=".58" cy=".08" r=".30">
