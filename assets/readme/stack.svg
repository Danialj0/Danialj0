  <rect x="379.6" y="54" width="69.2" height="32" rx="10" fill="url(#glassTile)" stroke="url(#rim)" stroke-width="1"/>
  <text x="414.2" y="75" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#f4f4f6">Next.js</text>
  <rect x="456.8" y="54" width="76.8" height="32" rx="10" fill="url(#glassTile)" stroke="url(#rim)" stroke-width="1"/>
