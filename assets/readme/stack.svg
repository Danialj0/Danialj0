  <rect x="541.6" y="54" width="61.6" height="32" rx="10" fill="url(#glassTile)" stroke="url(#rim)" stroke-width="1"/>
  <text x="572.4" y="75" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#f4f4f6">Vercel</text>
  <rect x="611.2" y="54" width="38.8" height="32" rx="10" fill="url(#glassTile)" stroke="url(#rim)" stroke-width="1"/>
  <text x="630.6" y="75" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#f4f4f6">n8n</text>
  <rect x="658.0" y="54" width="38.8" height="32" rx="10" fill="url(#glassTile)" stroke="url(#rim)" stroke-width="1"/>
