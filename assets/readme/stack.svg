  <rect x="790.8" y="54" width="61.6" height="32" rx="10" fill="url(#glassTile)" stroke="url(#rim)" stroke-width="1"/>
  <text x="821.6" y="75" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#f4f4f6">Agents</text>
  <rect x="860.4" y="54" width="38.8" height="32" rx="10" fill="url(#glassTile)" stroke="url(#rim)" stroke-width="1"/>
  <text x="879.8" y="75" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#f4f4f6">LLM</text>
