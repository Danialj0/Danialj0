<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Danial j  systems builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070708"/>
      <stop offset="55%" stop-color="#0e0e11"/>
      <stop offset="100%" stop-color="#16161a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4da3ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#4da3ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4da3ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#4da3ff" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#4da3ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4da3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#f4f4f6" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200"/>
    <path d="M80 0 V360 M160 0 V360 M240 0 V360 M320 0 V360 M400 0 V360 M480 0 V360 M560 0 V360 M640 0 V360 M720 0 V360 M800 0 V360 M880 0 V360 M960 0 V360 M1040 0 V360 M1120 0 V360"/>
  </g>

  <!-- signal path -->
  <path d="M720 250 C 820 210, 900 280, 980 230 S 1100 170, 1160 190" fill="none" stroke="#4da3ff" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="980" cy="230" r="22" fill="#4da3ff" fill-opacity="0.12" filter="url(#soft)"/>
  <circle cx="980" cy="230" r="5" fill="#4da3ff"/>

  <text x="72" y="88" fill="#4da3ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="4">INDUSTRIAL ENGINEERING · PRODUCTION SYSTEMS</text>

  <text x="68" y="178" fill="#f4f4f6" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="78" font-weight="700" letter-spacing="-1.5">Danial j</text>

  <text x="72" y="232" fill="#b4b8c2" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="24">I build systems that keep working after I log off.</text>

  <rect x="72" y="268" width="520" height="1" fill="url(#line)"/>

  <text x="72" y="308" fill="#f4f4f6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2">observe · analyze · decide · execute</text>
  <text x="560" y="308" fill="#4da3ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">danialj.com</text>
</svg>
