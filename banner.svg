  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#1c314d" stroke-width="2"/>
  <circle cx="30" cy="30" r="7" fill="#ff5f57"/>
  <circle cx="54" cy="30" r="7" fill="#febc2e"/>
  <circle cx="78" cy="30" r="7" fill="#28c840"/>
